const key='who-goes-next-roster-v1',selectionKey='who-goes-next-selections-v1';
let roster;try{let saved=JSON.parse(localStorage.getItem(key));roster=Array.isArray(saved)&&saved.length?saved:structuredClone(defaults)}catch(e){roster=structuredClone(defaults)}
const $=id=>document.getElementById(id),red=$('redSelect'),green=$('greenSelect');
let selected={red:'A01',green:'A02'};try{Object.assign(selected,JSON.parse(localStorage.getItem(selectionKey))||{})}catch(e){}
function save(){try{localStorage.setItem(key,JSON.stringify(roster));$('status').textContent='Saved in this browser.'}catch(e){$('status').textContent='Browser storage is full or unavailable. Use Backup roster to preserve changes.'}}
function saveSelection(){try{localStorage.setItem(selectionKey,JSON.stringify(selected))}catch(e){}}
function optionText(x,i){return (x.name.trim()||('Avatar '+(i+1)))+' · '+(x.group==='A'?'Your group':x.group==='B'?"Partner's group":'Added')}
function updateOptions(){for(const sel of [red,green]){sel.replaceChildren();roster.forEach((s,i)=>{const o=document.createElement('option');o.value=s.id;o.textContent=optionText(s,i);sel.append(o)})}if(!roster.some(s=>s.id===selected.red))selected.red=roster[0]?.id;if(!roster.some(s=>s.id===selected.green))selected.green=roster[1]?.id||roster[0]?.id;red.value=selected.red;green.value=selected.green;draw()}
function draw(){for(const side of ['red','green']){let s=roster.find(x=>x.id===selected[side]);let img=$(side+'Img'),name=$(side+'Name');if(s){img.src=s.image;img.alt=s.name?('Avatar for '+s.name):'Student avatar';name.textContent=s.name;name.classList.toggle('hidden',!s.name.trim())}else{img.removeAttribute('src');name.classList.add('hidden')}}saveSelection()}
red.onchange=()=>{selected.red=red.value;draw()};green.onchange=()=>{selected.green=green.value;draw()};$('swap').onclick=()=>{[selected.red,selected.green]=[selected.green,selected.red];updateOptions()};$('toggle').onclick=()=>{let hide=!$('controls').classList.contains('hidden');$('controls').classList.toggle('hidden',hide);$('toggle').textContent=hide?'Show controls':'Hide controls';$('toggle').setAttribute('aria-expanded',String(!hide))};
$('manage').onclick=()=>{renderRoster();$('editor').showModal()};$('close').onclick=()=>$('editor').close();
function renderRoster(){let holder=$('roster');holder.replaceChildren();roster.forEach((s,i)=>{let box=document.createElement('div');box.className='student';let pic=document.createElement('img');pic.src=s.image;pic.alt='Avatar '+(i+1);let inp=document.createElement('input');inp.value=s.name;inp.placeholder='First name (optional)';inp.setAttribute('aria-label','Name for avatar '+(i+1));inp.oninput=()=>{s.name=inp.value;save();updateOptions()};let tools=document.createElement('div');tools.className='tools';let replace=document.createElement('button');replace.textContent='Replace image';let file=document.createElement('input');file.type='file';file.accept='image/*';file.hidden=true;replace.onclick=()=>file.click();file.onchange=async()=>{if(!file.files[0])return;try{s.image=await imageData(file.files[0]);save();renderRoster();draw()}catch(e){$('status').textContent='Could not read that image.'}};tools.append(replace,file);if(s.group==='custom'){let del=document.createElement('button');del.textContent='Remove';del.onclick=()=>{if(confirm('Remove this student from the roster?')){roster=roster.filter(x=>x.id!==s.id);save();renderRoster();updateOptions()}};tools.append(del)}box.append(pic,inp,tools);holder.append(box)})}
function imageData(file){return new Promise((resolve,reject)=>{let reader=new FileReader();reader.onload=()=>{let im=new Image();im.onload=()=>{let c=document.createElement('canvas'),scale=Math.min(1,450/Math.max(im.width,im.height));c.width=Math.max(1,Math.round(im.width*scale));c.height=Math.max(1,Math.round(im.height*scale));c.getContext('2d').drawImage(im,0,0,c.width,c.height);resolve(c.toDataURL('image/png'))};im.onerror=reject;im.src=reader.result};reader.onerror=reject;reader.readAsDataURL(file)})}
$('add').onclick=async()=>{let file=document.createElement('input');file.type='file';file.accept='image/*';file.onchange=async()=>{if(!file.files[0])return;try{roster.push({id:'custom-'+Date.now(),group:'custom',name:'',image:await imageData(file.files[0])});save();renderRoster();updateOptions()}catch(e){$('status').textContent='Could not add image.'}};file.click()};
$('backup').onclick=()=>{let blob=new Blob([JSON.stringify(roster)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='who-goes-next-roster-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),5000)};
$('restore').onclick=()=>$('restoreFile').click();$('restoreFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let data=JSON.parse(await f.text());if(!Array.isArray(data)||!data.every(s=>typeof s.id==='string'&&typeof s.name==='string'&&typeof s.image==='string'))throw Error();if(confirm('Replace current roster with this backup?')){roster=data;save();renderRoster();updateOptions()}}catch(e){$('status').textContent='That is not a valid roster backup.'}e.target.value=''};
updateOptions();
</script></body></html>
